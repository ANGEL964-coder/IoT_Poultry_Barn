# ChirpStack v4 Configuration File
[network]
net_id = "000000"
enabled_regions = ["us915_1"]

[api]
bind = "0.0.0.0:8080"
secret = "sdn_lora_chirpstack_secret_key_change_in_production"

[postgresql]
dsn = "postgres://chirpstack:chirpstack@postgres/chirpstack?sslmode=disable"
max_open_connections = 10
min_idle_connections = 0

[redis]
servers = ["redis://redis:6379"]
tls_enabled = false

[gateway]
client = { ca_cert = "", tls_cert = "", tls_key = "" }

[integration]
enabled = ["mqtt"]

[integration.mqtt]
server = "tcp://mosquitto:1883"
json = true
clean_session = true
client_id = "chirpstack_integration"
