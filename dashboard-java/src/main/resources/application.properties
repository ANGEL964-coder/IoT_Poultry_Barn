server.port=8085

# SSL / HTTPS Configuration
server.ssl.enabled=true
server.ssl.key-store=classpath:certs/keystore.p12
server.ssl.key-store-password=sdn_poultry_ssl_2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=sdn-dashboard

# Mosquitto MQTT Broker Configuration
app.mqtt.broker-url=tcp://127.0.0.1:1883
app.mqtt.client-id=sdn-poultry-dashboard-backend
app.mqtt.app-id=44d003ef-2bd1-480a-84cf-87ff6dc27506
app.mqtt.uplink-topic=application/+/device/+/event/up
app.mqtt.downlink-topic-template=application/%s/device/%s/command/down

# Poultry Barn Defaults
app.poultry.hopper-capacity-kg=20.0

# Logging
logging.level.com.sdn.poultry=INFO
logging.level.org.springframework=INFO

# PostgreSQL & Spring Data JPA Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chirpstack
spring.datasource.username=chirpstack
spring.datasource.password=chirpstack
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Claude Opus IPC Configuration
app.claude.ipc.enabled=true
app.claude.ipc.socket-path=/run/user/1000/cc-socks/2894.sock
app.claude.ipc.sessions-dir=/home/server/.claude/sessions
app.claude.ipc.pid=2894
app.claude.ipc.connect-timeout-ms=2000
app.claude.ipc.auth-timeout-ms=3000

# Documentation Output
app.docs.output-dir=docs
app.docs.filename=TECHNICAL_DOCUMENTATION.md

# Security Rate Limiter & Bootstrap Configuration
app.security.rate-limit.max-requests=120
app.security.rate-limit.window-seconds=60
app.security.bootstrap-key=sdn_master_admin_key_2026


