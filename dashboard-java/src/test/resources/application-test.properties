# H2 In-Memory Database for Unit & Repository Slice Tests (PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable real MQTT connection attempt in test slices
app.mqtt.broker-url=tcp://127.0.0.1:1883
app.mqtt.client-id=sdn-test-backend
app.mqtt.app-id=44d003ef-2bd1-480a-84cf-87ff6dc27506
app.mqtt.uplink-topic=application/+/device/+/event/up
app.mqtt.downlink-topic-template=application/%s/device/%s/command/down
app.poultry.hopper-capacity-kg=20.0

# Security Rate Limiter & Bootstrap Configuration
app.security.rate-limit.max-requests=120
app.security.rate-limit.window-seconds=60
app.security.bootstrap-key=sdn_master_admin_key_2026

# Claude Opus IPC Configuration for Tests
app.claude.ipc.enabled=true
app.claude.ipc.socket-path=/run/user/1000/cc-socks/2894.sock
app.claude.ipc.sessions-dir=/home/server/.claude/sessions
app.claude.ipc.pid=2894
app.claude.ipc.connect-timeout-ms=1000
app.claude.ipc.auth-timeout-ms=1000

# Documentation Output for Tests
app.docs.output-dir=target/test-docs
app.docs.filename=TECHNICAL_DOCUMENTATION.md

