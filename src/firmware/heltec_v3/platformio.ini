; PlatformIO Project Configuration for Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; SDN LoRaWAN Architecture - Phase 1

[platformio]
default_envs = heltec_v3_us915

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib @ ^6.6.0

; Environment for US915 (Laird RG1 915 MHz)
[env:heltec_v3_us915]
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I include

; Environment for EU868 (Laird RG1 868 MHz)
[env:heltec_v3_eu868]
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CFG_eu868=1
    -I include
