; PlatformIO Project Configuration File for SDN-LoRa Node (Phase 1)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_us915

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1

; -----------------------------------------------------------------------------
; Environment for US915 Band (America - Laird RG1 915MHz)
; -----------------------------------------------------------------------------
[env:esp32_us915]
build_flags =
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_sx1276_radio=1
    -D CFG_us915=1
    -I include

; -----------------------------------------------------------------------------
; Environment for EU868 Band (Europe - Laird RG1 868MHz)
; -----------------------------------------------------------------------------
[env:esp32_eu868]
build_flags =
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_sx1276_radio=1
    -D CFG_eu868=1
    -I include
